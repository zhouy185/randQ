[project]
name = "randq"
version = "0.0.2"
description = "This CLI draws a name and question repeatedly until the user choose to stop"
readme = "README.md"
authors = [
    { name = "Monu Chaurasiya", email = "chaurasm@mcmaster.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.64.0",
]
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.64.0",
]

[project.scripts]
randq = "randq.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
